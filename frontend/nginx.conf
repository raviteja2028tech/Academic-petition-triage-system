server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # uploads are capped at 2 MB by the API; allow a little multipart overhead
  client_max_body_size 3m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

  # same-origin proxy: the browser never talks to the API host directly, so no CORS is needed
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    # nginx does not inherit server-level add_header once a location sets its own, so repeat the security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }

  # single-page app: client-side routes fall back to index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }
}
