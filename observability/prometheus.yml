global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: triage-api            # API + (via Redis) worker-side counters and histograms
    metrics_path: /metrics
    static_configs: [{targets: ["api:8000"]}]
  - job_name: cadvisor              # container CPU / memory / network
    static_configs: [{targets: ["cadvisor:8080"]}]
